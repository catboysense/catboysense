name: змейка

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: рисуем розовую змейку
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5fa2&color_dots=#fbe9f2,#f9c6dd,#f39ac3,#e86aa6,#c93d86
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff8cc6&color_dots=#1f1a24,#4f2440,#7e2f62,#b44289,#ff6fae

      - name: кладём картинки в ветку output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: змейка обновлена
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
