<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="спасибо, что заглядываешь (=^･ω･^=)">
  <title>спасибо, что заглядываешь</title>
  <style>
    .t1 { font: 800 31px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #7a4690; }
    .t2 { font: 700 24px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #ff5fa2; }
    .peekL { animation: peek 4s ease-in-out infinite; }
    .peekR { animation: peek 4s ease-in-out infinite; animation-delay: -2s; }
    @keyframes peek { 0%, 100% { transform: translateY(8px); } 50% { transform: translateY(-2px); } }
    .waveA { animation: driftA 9s linear infinite; }
    .waveB { animation: driftB 6s linear infinite; }
    @keyframes driftA { to { transform: translateX(-250px); } }
    @keyframes driftB { from { transform: translateX(-200px); } to { transform: translateX(0); } }
    .tw { transform-box: fill-box; transform-origin: center; animation: tw 2.6s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { transform: scale(.3) rotate(0deg); opacity: .2; } 50% { transform: scale(1) rotate(25deg); opacity: 1; } }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.5s ease-in-out infinite; }
    @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 14% { transform: scale(1.25); } 28% { transform: scale(.95); } 42% { transform: scale(1.15); } }
    /* character bits, same as the header */
    .head { transform-origin: 120px 176px; animation: tilt 4.4s ease-in-out infinite; }
    .cb .head { animation-delay: -2.2s; }
    .blink { transform-origin: 120px 130px; animation: blink 4.6s linear infinite; }
    .cb .blink { animation-duration: 5.3s; animation-delay: -1.7s; }
    .cear-l { transform-origin: 78px 58px; animation: twitch 6s ease-in-out infinite; }
    .cear-r { transform-origin: 162px 58px; animation: twitch 6s ease-in-out infinite; animation-delay: -3.1s; }
    .cb .cear-l { animation-delay: -1.4s; }
    .cb .cear-r { animation-delay: -4.2s; }
    .ahoge { transform-origin: 122px 34px; animation: boing 2.2s ease-in-out infinite; }
    @keyframes twitch { 0%, 82%, 100% { transform: rotate(0deg); } 85% { transform: rotate(-16deg); } 88% { transform: rotate(6deg); } 91% { transform: rotate(-8deg); } 94% { transform: rotate(0deg); } }
    @keyframes tilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
    @keyframes boing { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  </style>
