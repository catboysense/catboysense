<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Мои фичи в Bahagram: призрак без дублей и фантомов; кружки с основной камеры и зумом до 10×; снег в чатах; галочки для разрабов и саппортеров; иконки с бойкиссером и котиком; TikTok и Shorts качаются напрямую; расшифровка голосовых и кружков через Apple">
  <title>Мои фичи в Bahagram</title>
  <style>
    .title { font: 800 22px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #5b2a6e; }
    .sub { font: 500 16px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #8a5b96; }
    .bob { animation: bob 5s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .float { animation: float 2.8s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translate(0, 2px) rotate(-4deg); } 50% { transform: translate(0, -4px) rotate(4deg); } }
    .spin { animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rec { animation: rec 1.6s steps(1) infinite; }
    @keyframes rec { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
    .tw { transform-box: fill-box; transform-origin: center; animation: tw 2.2s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { transform: scale(.4) rotate(0deg); opacity: .35; } 50% { transform: scale(1.1) rotate(30deg); opacity: 1; } }
    .wiggle { animation: wiggle 3.2s ease-in-out infinite; }
    @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0deg); } 76% { transform: rotate(-8deg); } 82% { transform: rotate(7deg); } 88% { transform: rotate(-4deg); } }
    .drop { animation: drop 1.4s ease-in-out infinite; }
    @keyframes drop { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(4px); } }
    .wave1, .wave2 { animation: wave 1.6s ease-in-out infinite; }
    .wave2 { animation-delay: .25s; }
    @keyframes wave { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }
    .peek { animation: peek 3.6s ease-in-out infinite; }
    @keyframes peek { 0%, 100% { transform: translateY(10px); } 35%, 70% { transform: translateY(0); } }
  </style>
